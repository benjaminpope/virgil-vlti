name: claude review

# Claude reviews each pull request when it is opened or marked ready for
# review, and answers any comment that mentions @claude (for example
# "@claude review again" after new commits). It needs the Claude GitHub App
# installed on the repository and a CLAUDE_CODE_OAUTH_TOKEN secret (from
# `claude setup-token`). Pull requests from forks get no secrets, so they
# are not reviewed.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          # Only automatic reviews get this prompt; an @claude comment is
          # answered as written.
          prompt: >-
            ${{ github.event_name == 'pull_request' && format('REPO {0}, PR {1}. Review this pull request. Read AGENTS.md and PLAN.md first and hold the change to them. This repository calibrates GRAVITY data (with a PIONIER pair test and MATISSE header handling) for virgil, so look for, in order of importance - wrong calibration mathematics (transfer functions, error propagation, covariances, closure-phase and visibility conventions, units, wavelength or baseline handling); error models that would under- or over-state the noise, or that are fitted and checked on the same data; tests that would pass even if the method were wrong (synthetic products that share the code under test, loose tolerances, controls that cannot fail); breaches of the boundary with virgil (virgil importing this package, generic machinery that belongs in virgil, data or target-specific science committed here); new methods without a PROVENANCE.md row, and docs or design notes left stale by the change. Do not comment on style that ruff already enforces. Put each specific problem in an inline comment on the line, with the failure it would cause. Finish with one short summary comment; if you find nothing worth changing, say so in one line.', github.repository, github.event.pull_request.number) || '' }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
