name: eso-pipelines-sif
# Builds an Apptainer image of ESO's VLT pipelines from containers/eso-pipelines.def
# (ESO's definition file + EDPS) and uploads it as a run artifact. Some HPC clusters cannot
# build it: unprivileged builds there map a single user ID, too few for rpm
# (2026-10-04). Start by hand (Actions tab, or
#   gh workflow run eso-pipelines-sif.yml -R benjaminpope/virgil-vlti -f pipelines=gravity),
# then fetch with
#   gh run download <run-id> -R benjaminpope/virgil-vlti -n eso-pipelines-<pipelines>
# (-f fedora=42 picks another base release.)
# Pull requests that change the container also build it, with the default (gravity).
on:
  pull_request:  # a PR that changes the container builds it (default: gravity)
    paths: [containers/**, .github/workflows/eso-pipelines-sif.yml]
  workflow_dispatch:
    inputs:
      pipelines:
        description: "ESO pipeline package names, separated by ';' (e.g. gravity or gravity;matisse)"
        default: gravity
        required: true
      fedora:
        description: "Fedora release of the base image (ESO's repository has 41-43)"
        default: "43"
        required: true

env:
  PIPES: ${{ inputs.pipelines || 'gravity' }}
  FEDORA: ${{ inputs.fedora || '43' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        # The runner has ~14 GB free; a Fedora image with the GRAVITY pipeline needs a
        # few GB of build space and the image itself.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: install apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -q
          sudo apt-get install -y -q apptainer
          apptainer --version
      - name: build
        run: |
          NAME="eso-pipelines-${PIPES//;/-}-fc${FEDORA}-$(date -u +%Y%m%d)"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          sudo apptainer build --build-arg pipelines="$PIPES" --build-arg fedora="$FEDORA" "$NAME.sif" containers/eso-pipelines.def
          ls -la "$NAME.sif"
      - name: smoke test
        # Write to files first: with bash's pipefail, `cmd | head` fails the step when
        # head closes the pipe early (Copilot review, virgil-vlti#13).
        run: |
          apptainer exec "$NAME.sif" esorex --version > esorex-version.txt
          head -n 3 esorex-version.txt
          apptainer exec "$NAME.sif" esorex --recipes > recipes.txt
          grep -c . recipes.txt
          grep -i gravi recipes.txt || { echo "no GRAVITY recipes"; exit 1; }
          apptainer exec "$NAME.sif" rpm -qa > rpms.txt
          grep -i -E "esopipe|cpl|esorex|edps" rpms.txt | sort | tee versions.txt
          if apptainer exec "$NAME.sif" sh -c 'command -v edps' > /dev/null; then echo "edps present"; else echo "no edps"; fi
          apptainer exec "$NAME.sif" cat /etc/fedora-release
          sha256sum "$NAME.sif" | tee "$NAME.sif.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: eso-pipelines-${{ env.PIPES }}
          path: |
            ${{ env.NAME }}.sif
            ${{ env.NAME }}.sif.sha256
            versions.txt
            recipes.txt
          retention-days: 30
          compression-level: 0  # the SIF is already squashfs-compressed
